[workspace]
members = [
    "crates/use-signal",
    "crates/use-sample",
    "crates/use-amplitude",
    "crates/use-frequency",
    "crates/use-signal-window",
    "crates/use-signal-normalize",
    "crates/use-signal-energy",
    "crates/use-zero-crossing",
    "crates/use-simple-filter",
]
resolver = "2"

[workspace.package]
authors = ["RustUse Contributors"]
edition = "2024"
homepage = "https://rustuse.org"
license = "MIT OR Apache-2.0"
publish = false
readme = "README.md"
repository = "https://github.com/RustUse/use-signal"
rust-version = "1.95.0"
version = "0.0.2"

[workspace.dependencies]
use-amplitude = { version = "0.0.2", path = "crates/use-amplitude" }
use-frequency = { version = "0.0.2", path = "crates/use-frequency" }
use-sample = { version = "0.0.2", path = "crates/use-sample" }
use-signal = { version = "0.0.2", path = "crates/use-signal" }
use-signal-energy = { version = "0.0.2", path = "crates/use-signal-energy" }
use-signal-normalize = { version = "0.0.2", path = "crates/use-signal-normalize" }
use-signal-window = { version = "0.0.2", path = "crates/use-signal-window" }
use-simple-filter = { version = "0.0.2", path = "crates/use-simple-filter" }
use-zero-crossing = { version = "0.0.2", path = "crates/use-zero-crossing" }

[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.metadata.rustuse.release]
publish = false
versioning = "lockstep-0.x"
first-publish-candidates = [
    "use-sample",
    "use-amplitude",
    "use-frequency",
    "use-signal-window",
    "use-signal-normalize",
    "use-signal-energy",
    "use-zero-crossing",
    "use-simple-filter",
    "use-signal",
]
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
expect_used = "warn"
multiple_crate_versions = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
